<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/brand_img.png"
    />

    <link rel="stylesheet" href="./index.css" />
    <title>Serenity Media | QR code component</title>
